[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 6 requires Node >=22.12; "22" resolves to the latest 22.x on Netlify.
  NODE_VERSION = "22"

# The wiki moved to wiki.citizeninfra.org on 2026-08-02. Setting a primary
# custom domain in Netlify does NOT redirect the .netlify.app subdomain to it
# — both hosts kept serving 200 — so the redirect has to be declared here.
#
# force = true is required: without it this rule loses to the static file that
# exists at every path on the site, and the redirect silently never fires.
# :splat preserves the path, so deep links survive rather than all landing on
# the homepage.
[[redirects]]
  from = "https://citizen-infra.netlify.app/*"
  to = "https://wiki.citizeninfra.org/:splat"
  status = 301
  force = true

# The hyphenated domain exists because the GitHub org is Citizen-Infra and the
# old host was citizen-infra.netlify.app, so anyone who knows CIBC will type the
# hyphen. It is a redirect-only domain and must never serve content.
#
# This host is a Netlify domain alias on this site rather than a GoDaddy
# forward, and that is deliberate: GoDaddy's forwarding is HTTP-only, and every
# current browser tries HTTPS first, so an HTTP-only forward mostly never fires.
# Netlify issues a real certificate for the alias, so the redirect works on the
# scheme people actually arrive on.
[[redirects]]
  from = "https://wiki.citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://wiki.citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/:splat"
  status = 301
  force = true

# The hyphenated apex used to be handled here — four rules sending
# citizen-infra.org and www.citizen-infra.org to the wiki. That was an explicit
# stopgap: the citizeninfra.org apex was a GoDaddy parking page, the wiki was
# the only real CIBC content on the web, and GoDaddy's own forwarding is
# HTTP-only so it mostly never fired.
#
# The apex shipped on 2026-08-04 (Citizen-Infra/cibc-website), so those rules
# moved to that repo's netlify.toml, repointed at https://citizeninfra.org/ and
# with :splat added — the destination is now this domain's mirror, so a
# forwarded path reaches the matching page instead of 404ing on the wiki.
#
# The Netlify domain aliases moved with them, and that is the part worth
# remembering: a redirect only fires on the site that RECEIVES the request. A
# hostname can be claimed by one Netlify site at a time, so the rules and the
# aliases have to move together or the domain goes dark. Rules were deployed on
# the destination first, then the aliases released here and claimed there.
#
# wiki.citizen-infra.org stays (the two rules above) — that one is the wiki's
# own hyphenated host and still belongs to this site.
