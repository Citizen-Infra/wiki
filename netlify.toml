[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 6 requires Node >=22.12; "22" resolves to the latest 22.x on Netlify.
  NODE_VERSION = "22"

# The wiki moved to wiki.citizeninfra.org on 2026-08-02. Setting a primary
# custom domain in Netlify does NOT redirect the .netlify.app subdomain to it
# — both hosts kept serving 200 — so the redirect has to be declared here.
#
# force = true is required: without it this rule loses to the static file that
# exists at every path on the site, and the redirect silently never fires.
# :splat preserves the path, so deep links survive rather than all landing on
# the homepage.
[[redirects]]
  from = "https://citizen-infra.netlify.app/*"
  to = "https://wiki.citizeninfra.org/:splat"
  status = 301
  force = true

# The hyphenated domain exists because the GitHub org is Citizen-Infra and the
# old host was citizen-infra.netlify.app, so anyone who knows CIBC will type the
# hyphen. It is a redirect-only domain and must never serve content.
#
# This host is a Netlify domain alias on this site rather than a GoDaddy
# forward, and that is deliberate: GoDaddy's forwarding is HTTP-only, and every
# current browser tries HTTPS first, so an HTTP-only forward mostly never fires.
# Netlify issues a real certificate for the alias, so the redirect works on the
# scheme people actually arrive on.
[[redirects]]
  from = "https://wiki.citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://wiki.citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/:splat"
  status = 301
  force = true

# The apex of the hyphenated domain also lands here, which is odd on the face
# of it: this is the wiki's site, and citizen-infra.org should end up pointing
# at the CIBC landing page. It is here because the wiki site is the only CIBC
# Netlify site that exists today, and the alternative was leaving the apex on
# GoDaddy's HTTP-only forwarding, which refuses HTTPS and therefore does not
# fire for most visitors.
#
# These rules point at the WIKI, not at the citizeninfra.org apex, and that is
# a deliberate stopgap. The apex still serves a GoDaddy Website Builder parking
# page, so sending the hyphenated domain there delivers visitors reliably to a
# page that says nothing. The wiki is the only real CIBC content on the web
# today, so it is the honest destination until the landing page ships.
#
# WHEN Citizen-Infra/cibc-website#1 SHIPS: repoint these four rules at
# https://citizeninfra.org/ and move the whole block into that repo's
# netlify.toml. Moving a redirect costs nothing — no OAuth grants, no Search
# Console verification, none of the migration cost behind the never-move-twice
# rule in cibc-brain/decisions/2026-08-02-citizeninfra-domain-map.md.
#
# No :splat here, unlike the wiki rules above. Paths on the hyphenated apex
# have never resolved to anything, so there are no deep links worth preserving,
# and forwarding an arbitrary path onto the wiki would produce 404s instead of
# a usable page.
[[redirects]]
  from = "https://citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/"
  status = 301
  force = true

[[redirects]]
  from = "http://citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.citizen-infra.org/*"
  to = "https://wiki.citizeninfra.org/"
  status = 301
  force = true
